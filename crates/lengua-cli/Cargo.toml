[package]
name = "lengua-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "lengua: a git-backed CLI for managing a library of templated text/snippets"

[[bin]]
name = "lengua"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
lengua-core = { version = "0.1.0", path = "../lengua-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
