name: Release

# Bumping VERSION and merging that into main is what triggers a release. Tagging and building
# happen in the same workflow run (not two chained ones): a tag pushed using the default
# GITHUB_TOKEN does not itself trigger other workflows, so an "on tag push" build workflow fed
# by a separate "create the tag" workflow would never fire.
on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.check.outputs.release_exists == 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check what's already done
        id: check
        run: |
          if gh release view "v$(tr -d '[:space:]' < VERSION)" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release notes from CHANGELOG.md
        if: steps.check.outputs.release_exists == 'false'
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            $0 ~ ("^## \\[" ver "\\]") {flag=1; next}
            /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [${{ steps.version.outputs.version }}]' section - add one (release notes are pulled from it) before bumping VERSION."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.release_exists == 'false'
        with:
          name: release-notes
          path: release_notes.md

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          # Asset names follow `lengua_<version>_<os>_<arch>` (matching
          # jprybylski/datum's goreleaser convention) rather than raw Rust
          # target triples - a user deciding whether to trust a prebuilt
          # binary shouldn't have to know what "unknown-linux-gnu" means.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --package lengua-cli --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        env:
          ASSET: lengua_${{ needs.prepare.outputs.version }}_${{ matrix.asset_os }}_${{ matrix.asset_arch }}
        run: |
          mkdir -p dist
          if [ "${{ matrix.asset_os }}" = "windows" ]; then
            7z a "dist/$ASSET.zip" "./target/${{ matrix.target }}/release/lengua.exe"
          else
            tar -czf "dist/$ASSET.tar.gz" -C "target/${{ matrix.target }}/release" lengua
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lengua_${{ needs.prepare.outputs.version }}_${{ matrix.asset_os }}_${{ matrix.asset_arch }}
          path: dist/*

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.prepare.outputs.tag }}" -m "Release ${{ needs.prepare.outputs.tag }}"
          git push origin "${{ needs.prepare.outputs.tag }}"

      - name: Create release
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ needs.prepare.outputs.tag }}" \
            --notes-file artifacts/release-notes/release_notes.md \
            artifacts/lengua_*/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
